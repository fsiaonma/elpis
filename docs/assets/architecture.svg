      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#e3efff"/>
    </linearGradient>
    <linearGradient id="biz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="fw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68a5fc"/>
