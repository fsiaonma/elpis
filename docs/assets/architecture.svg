    <rect x="966" y="350" width="150" height="28" rx="7" fill="#fff"/><text x="1041" y="369" text-anchor="middle">dashboard 路由</text>
    <rect x="808" y="386" width="150" height="28" rx="7" fill="#fff"/><text x="883" y="405" text-anchor="middle">schema-table</text>
    <rect x="966" y="386" width="150" height="28" rx="7" fill="#fff"/><text x="1041" y="405" text-anchor="middle">schema-form</text>
